<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Front desk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside class="side">
    <h1>Front desk</h1>
    <nav id="nav">
      <button data-view="dashboard" class="on">Today</button>
      <button data-view="bookings">Bookings</button>
      <button data-view="rooms">Rooms</button>
      <button data-view="guests">Guests</button>
    </nav>
  </aside>

  <main>
    <header class="bar">
      <h2 id="title"></h2>
      <div id="actions"></div>
    </header>
    <div id="msg" role="status" hidden></div>
    <section id="content"></section>
  </main>

  <dialog id="dlg">
    <form method="dialog" id="form">
      <h3 id="dlg-title"></h3>
      <div id="fields"></div>
      <p id="form-error" class="err" hidden></p>
      <div class="row-end">
        <button type="button" class="ghost" id="cancel">Cancel</button>
        <button type="submit" class="primary" id="save">Save</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
